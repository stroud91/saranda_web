---
# cPanel → Git Version Control → "Deploy HEAD Commit" runs these tasks, from the
# repository's own folder (repositories/saranda_web). The site runs as a
# "Setup Python App" (Passenger) at the domain root; see deploy/cpanel_deploy.sh
# for what each deploy does and the paths it uses.
deployment:
  tasks:
    - /bin/bash deploy/cpanel_deploy.sh
