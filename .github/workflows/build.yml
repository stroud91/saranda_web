# Tests the backend and the frontend engines, then builds the static site and
# publishes it as a ready-to-upload zip ("namecheap-public_html") on each run.
name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Backend tests (includes the static-bundle freshness check)
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: travago-tour-app/package-lock.json
      - name: Frontend tests (JS engines must match the Python engines)
        working-directory: travago-tour-app
        run: |
          npm ci
          npm test
      - name: Build the static site and zip it for public_html
        run: bash deploy/package_static.sh

      - uses: actions/upload-artifact@v5
        with:
          name: namecheap-public_html
          path: travago-tour-app/dist/saranda-public_html.zip
          retention-days: 30
